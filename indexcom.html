<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Ludwig - Professional Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #111827;
            --text-color: #d1d5db;
            --text-color-strong: #ffffff;
            --text-color-subtle: #9ca3af;
            --card-bg: #1f2937;
            --border-color: #374151;
            --client-tag-bg: rgba(22, 163, 175, 0.2);
            --client-tag-text: #67e8f9;
        }
        .light-theme {
            --bg-color: #f3f4f6;
            --text-color: #374151;
            --text-color-strong: #111827;
            --text-color-subtle: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --client-tag-bg: #cffafe;
            --client-tag-text: #0e7490;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .text-gradient {
            background: linear-gradient(to right, #67e8f9, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .section-break {
            border-top: 1px solid var(--border-color);
            transition: border-color 0.3s ease;
        }
        .bg-main { background-color: var(--bg-color); }
        .text-main { color: var(--text-color); }
        .text-strong { color: var(--text-color-strong); }
        .text-subtle { color: var(--text-color-subtle); }
        .border-main { border-color: var(--border-color); }
        .client-tag {
            background-color: var(--client-tag-bg);
            color: var(--client-tag-text);
        }
    </style>
</head>
<body class="antialiased">
    <div>Coming Soon</div>
</body>
</html>
